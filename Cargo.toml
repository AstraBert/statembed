[package]
name = "statemebed"
version = "0.1.0"
edition = "2024"

[dependencies]
memmap2 = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tokenizers = { version = "0.23", default-features = false, features = ["onig", "esaxx_fast"], optional = true }
hf-hub = { version = "1.0.0", optional = true }
dirs = { version = "6", optional = true }

[features]
default = ["tokenizers"]
tokenizers = ["dep:tokenizers"]
hf-hub = ["dep:hf-hub", "dep:dirs"]
