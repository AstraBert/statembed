[package]
name = "statemebed"
version = "0.1.0"
edition = "2024"

[dependencies]
memmap2 = "0.9"
half = "2.7"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
memoize = "0.6"
tokenizers = { version = "0.23", default-features = false, features = ["onig", "esaxx_fast"], optional = true }
hf-hub = { version = "1.0.0", optional = true }
dirs = { version = "6", optional = true }

[features]
default = ["tokenizers"]
tokenizers = ["dep:tokenizers"]
hf-hub = ["dep:hf-hub", "dep:dirs"]

[dev-dependencies]
model2vec-rs = "0.2"
criterion = { version = "0.8", features = ["html_reports"] }

[[bench]]
name = "embed_benchmark"
harness = false

[[bench]]
name = "m2vec_benchmark"
harness = false
