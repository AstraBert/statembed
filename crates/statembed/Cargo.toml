[package]
name = "statembed"
version = "1.0.0"
edition = "2024"
license = "MIT"
readme = "README.md"
repository = "https://github.com/AstraBert/statembed"
description = "Fast, lightweight static text embeddings for Rust"
keywords = ["static-embeddings", "retrieval", "rust", "huggingface", "tokenizers"]
include = [
    "src/**/*",
    "Cargo.toml",
    "README.md",
    "LICENSE",
]

[dependencies]
memmap2 = { version = "0.9" }
half = "2.7"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
hf-hub = { version = "1.0.0", optional = true }
dirs = { version = "6", optional = true }
wide = { version = "1.6.1", optional = true }
rayon = { version = "1", optional = true }
tokenizers = { version = "1.0.0-rc.2", default-features = false, features = ["regex"] }

[features]
default = ["simd"]
hf-hub = ["dep:hf-hub", "dep:dirs"]
simd = ["dep:wide"]
rayon = ["dep:rayon"]

[dev-dependencies]
model2vec-rs = "0.2"
criterion = { version = "0.8", features = ["html_reports"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[[bench]]
name = "embed_benchmark"
harness = false

[[bench]]
name = "m2vec_benchmark"
harness = false

[[bench]]
name = "init_benchmark"
harness = false

[[bench]]
name = "components_benchmark"
harness = false
